<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>🔒 管理後台</title>
<style>
:root{color-scheme:dark;--bg:#07080d;--card:#0f1118;--fg:#e8edf2;--muted:#8b929c;--line:rgba(255,255,255,.1);--accent:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(800px 500px at 50% 0%,rgba(34,211,238,.12),transparent 70%),var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.box{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
h1{margin:0 0 8px;font-size:1.5rem}
p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#07080d;color:var(--fg);font:14px ui-monospace,monospace}
input[type=password]:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.row label{display:flex;align-items:center;gap:6px;margin:0}
button{padding:10px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#a855f7);color:#05060a;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.4em;margin:12px 0 0;color:#f87171;font-size:.85rem}
details{margin-top:14px;font-size:.84rem;color:var(--muted)}
summary{cursor:pointer;color:var(--fg)}
a{color:var(--accent)}
.back{display:inline-block;margin-top:18px;font-size:.84rem}
</style>
</head>
<body>
<form class="box" id="f">
<h1>🔒 管理後台</h1>
<p>這裡會顯示和公開網站一樣的畫面，但包含私有 repo、健康檢查和待處理事項。資料放在私有 repo，只有能讀取它的 GitHub 金鑰才打得開。</p>
<label for="tk">GitHub 金鑰（fine-grained token）</label>
<input id="tk" type="password" autocomplete="current-password" spellcheck="false" required>
<div class="row"><label><input type="checkbox" id="rm" checked> 在這台裝置記住我</label><button id="go">進入</button></div>
<div class="err" id="err" role="alert"></div>
<details><summary>第一次用：建立一把金鑰</summary><p style="margin:8px 0 0"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a><br>Repository access 選「Only select repositories」→ mintguesss/projects；Permissions → Contents 設成 Read-only。</p></details>
<a class="back" href="./">← 回公開網站</a>
</form>
<script>
(function () {
  var KEY = "repofolio-admin-token", API = "https://api.github.com/repos/mintguesss/projects/contents/admin.html", T = {"bad":"金鑰無效或已過期。","nf":"這把金鑰讀不到管理頁（權限不對，或還沒產生過）。","net":"連不上 GitHub，稍後再試。","loading":"載入中…","go":"進入"};
  var f = document.getElementById("f"), tk = document.getElementById("tk"), rm = document.getElementById("rm"), err = document.getElementById("err"), go = document.getElementById("go");
  function saved() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) { return null; } }
  function forget() { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} }
  function load(token, remember) {
    go.disabled = true; go.textContent = T.loading; err.textContent = "";
    fetch(API, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" }, cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { var e = new Error(r.status === 401 ? T.bad : T.nf); e.status = r.status; throw e; }
        return r.text();
      })
      .then(function (html) {
        try { forget(); (remember ? localStorage : sessionStorage).setItem(KEY, token); } catch (e) {}
        document.open(); document.write(html); document.close();
      })
      .catch(function (e) {
        if (e.status === 401 || e.status === 404 || e.status === 403) forget();
        err.textContent = e.status ? e.message : T.net;
        go.disabled = false; go.textContent = T.go; f.hidden = false;
      });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); var v = tk.value.trim(); if (v) load(v, rm.checked); });
  var s = saved();
  if (s) { f.hidden = true; load(s, (function () { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } })()); }
})();
</script>
</body>
</html>
