# repofolio config: https://github.com/mintguesss/repofolio
# Full reference: https://github.com/mintguesss/repofolio/blob/main/examples/repofolio.config.yml
owners: [mintguesss]
language: zh-TW
staleDays: 90
includePrivate: true    # private repos only appear in the encrypted admin page
llm:
  enabled: false
site:
  url: https://mintguesss.github.io/personal_web/repofolio/
  links:
    - { label: 個人網站, url: https://mintguesss.github.io/personal_web/ }
  hero:
    roles: []           # typing animation, e.g. [全端工程師, AI 應用開發]
  customizer: true
  theme:
    mode: tech          # simple | tech
    scheme: auto        # auto | light | dark
    layout: grid        # grid | list
# Card cover per project (screenshots from the personal site). Others use the README / repo screenshots.
images:
  Folio-manager: https://mintguesss.github.io/personal_web/builds/folio-manager.jpg
  nobook: https://mintguesss.github.io/personal_web/builds/nobook.png
  personal-assistant: https://mintguesss.github.io/personal_web/builds/personal-assistant.jpg
  PromptMiser: https://mintguesss.github.io/personal_web/builds/prompt-miser.jpg
  Clean-Contributors: https://mintguesss.github.io/personal_web/builds/clean-contributors.png
  ClaudeQuota: https://mintguesss.github.io/personal_web/builds/claude-quota.png
  TAICA_LLM: https://mintguesss.github.io/personal_web/builds/taica-llm.png
  personal_web: https://mintguesss.github.io/personal_web/builds/personal-web-site.png
issues:
  stale: false          # set true to get an issue here for each project idle > staleDays
publish:
  repo: mintguesss/personal_web
  path: public/repofolio
# Private admin view: same site + private repos, encrypted with the REPOFOLIO_ADMIN_PASSWORD secret.
admin:
  page: hq-7ce7f846be87.html
